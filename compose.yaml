services:
  rabbitmq:
    image: rabbitmq:4.4-management
    container_name: tqgo-rabbitmq
    hostname: tqgo-rabbitmq
    restart: unless-stopped

    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: dev
      RABBITMQ_DEFAULT_PASS: devpassword

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
